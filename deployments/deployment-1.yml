---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-server
  labels:
    app: proxy-server
    author: sai

spec:
  replicas: 2

  selector:
    matchLabels:
      app: proxy-server
  
  template:
    metadata:
      labels:
        app: proxy-server

    spec:
      containers:
      - name: nginx-server
        image: nginx:latest
        ports:
        - containerPort: 80
...